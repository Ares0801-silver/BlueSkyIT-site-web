<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Espace client Blue Sky IT</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="header-mount"></div>

<main class="auth-shell">
  <div class="auth-box">
    <div class="brand">
      <img src="assets/logo.png" alt="Blue Sky IT" style="height:34px;width:auto;">
    </div>
    <h1>Espace client</h1>
    <p class="auth-sub small">Connectez-vous pour accéder à votre espace.</p>

    <div class="form-card">
      <div id="formAlert" class="form-alert"></div>
      <form id="loginForm" novalidate>
        <div class="form-row" id="row-email">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" name="email" required autocomplete="email">
          <span class="form-error">Adresse e-mail invalide.</span>
        </div>
        <div class="form-row" id="row-password">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
          <span class="form-error">Merci d'indiquer votre mot de passe.</span>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Se connecter</button>
      </form>
      <p class="auth-switch">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
    </div>
  </div>
</main>

<div id="footer-mount"></div>
<script src="js/main.js"></script>
<script src="js/auth.js"></script>
<script>
  mountLayout('');
  initLoginForm();
</script>
</body>
</html>
